[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diddesign"
version = "0.1.3"
description = "Multiple-pre-treatment difference-in-differences with inspectable pandas result objects."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "Xuanyu Cai"},
    {name = "Wenli Xu"},
]
maintainers = [
    {name = "Xuanyu Cai", email = "xuanyuCAI@outlook.com"},
    {name = "Wenli Xu", email = "wlxu@cityu.edu.mo"},
]
keywords = [
    "difference-in-differences",
    "causal inference",
    "econometrics",
    "double did",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://github.com/gorgeousfish/diddesign-py"
Documentation = "https://diddesign-py.readthedocs.io"
Issues = "https://github.com/gorgeousfish/diddesign-py/issues"
Source = "https://github.com/gorgeousfish/diddesign-py"

[project.optional-dependencies]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2.0",
]
plot = [
    "matplotlib>=3.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-p no:asyncio"
python_classes = ["Test"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
diddesign = ["data/*.csv"]

[tool.setuptools.packages.find]
where = ["src"]
